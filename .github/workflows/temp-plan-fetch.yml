name: Temporary Plan Fetch

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install recovery dependencies
        run: |
          python -m pip install --quiet requests beautifulsoup4 pymupdf python-docx
      - name: Recover official planning documents
        run: |
          python tools/collect_plans.py
      - name: Upload recovered documents and audit report
        uses: actions/upload-artifact@v4
        with:
          name: recovered-official-plans
          path: recovered_plans
          if-no-files-found: error
          retention-days: 1
