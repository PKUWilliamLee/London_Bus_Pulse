name: Temporary Plan Fetch

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run search probe
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python tools/temp_plan_search.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: temporary-plan-search-probe
          path: search_results.json
          if-no-files-found: error
          retention-days: 1
